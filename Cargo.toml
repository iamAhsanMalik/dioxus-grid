[workspace]
resolver = "3"
members = ["grid-core", "grid-dioxus", "grid-plugin-api", "grid-state"]
# The example carries its own manifest (it needs dioxus/web) so the library
# crates stay dependency-light.
exclude = ["examples"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85.0"
license = "MIT OR Apache-2.0"
authors = ["Ahsan Malik"]
homepage = "https://github.com/iamAhsanMalik/dioxus-grid"
repository = "https://github.com/iamAhsanMalik/dioxus-grid"
keywords = ["gui", "dioxus", "datagrid", "table", "wasm"]
categories = ["gui", "wasm"]

[workspace.dependencies]
dioxus = { version = "0.7" }
grid-core = { path = "grid-core", version = "0.1.0" }
grid-plugin-api = { path = "grid-plugin-api", version = "0.1.0" }
grid-state = { path = "grid-state", version = "0.1.0" }

# Size-first release profile for wasm consumers.
[profile.release]
opt-level = "s"
lto = "fat"
codegen-units = 1
strip = true
